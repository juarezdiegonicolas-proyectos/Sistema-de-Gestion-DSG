            async function apiGuardar(key, data) {
                const { error } = await db.from('comunicados_memos').upsert({ id_clave: key, contenido: data });
                if (error) console.error("Error al guardar en Supabase:", error);
            }

            async function manejarCambioDepto(idSeccion) {
                const selectDepto = document.getElementById('depto-' + idSeccion);
                const contenedorSup = document.getElementById('contenedor-supervisor-' + idSeccion);
                const selectSup = document.getElementById('supervisor-' + idSeccion);

                if (!selectDepto || !contenedorSup || !selectSup) return;

                const deptoVal = selectDepto.value;

                if (deptoVal === 'intendencia') {
                    contenedorSup.style.display = 'inline-block';
                    try {
                        const { data, error } = await db
                            .from('cierres_jornada')
                            .select('supervisor')
                            .eq('departamento', 'Intendencia');

                        if (error) throw error;

                        selectSup.innerHTML = '<option value="">-- Todos los supervisores --</option>';
                        const unicos = [...new Set((data || []).map(item => item.supervisor))].filter(Boolean).sort();

                        unicos.forEach(nombre => {
                            const opt = document.createElement('option');
                            opt.value = nombre;
                            opt.textContent = nombre;
                            selectSup.appendChild(opt);
                        });
                    } catch (err) {
                        console.error("Error al cargar supervisores:", err);
                    }
                } else {
                    contenedorSup.style.display = 'none';
                    selectSup.value = '';
                }
            }

                <input type="number" id="est-anio" class="input-fecha" value="2026" style="width:100px;">
                <button class="btn-gestion" style="background: #1a3a5f; color: white;" onclick="generarReporteMensual()">Generar Reporte</button>
            </div>
            <div id="visor-estadisticas" style="padding: 20px; border: 1px solid #eee; text-align: center;">
                <p>Seleccione tipo de reporte, mes y año para consolidar.</p>
            </div>
        </div>
    </div>

    <script>
        let archivoData = {};
        let archivosCacheMap = {}; // Caché local para múltiples archivos en novedades

        function mostrar(id, titulo) { 
            document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activo')); 
            document.getElementById(id).classList.add('activo'); 
            document.getElementById('titulo-panel').innerText = titulo; 
            if (id === 'estado-ascensores') {
                cargarEstadoAscensoresVivo();
            }
            if (id === 'novedades') {
                cargarHistorialMuro('novedades');
            }
        }

        function limpiarPantalla(id) {
            document.getElementById('txt-' + id).value = '';
            document.getElementById('print-' + id).innerText = '';
            const preview = document.getElementById('preview-' + id);
            if (preview) {
                preview.style.display = 'none';
                preview.innerHTML = '';
            }
            const chips = document.getElementById('chips-' + id);
            if (chips) chips.innerHTML = '';
            document.getElementById('depto-destino-' + id).value = 'Todos';
            document.getElementById('turno-destino-' + id).value = 'Todos';
            actualizarPrint(id);
            delete archivoData[id];
            if (archivosCacheMap[id]) archivosCacheMap[id] = [];
        }

        async function cargarEstadoAscensoresVivo() {
            const visor = document.getElementById('visor-estado-ascensores');
            visor.innerHTML = '<p style="text-align:center;">Cargando estado actual de ascensores...</p>';
            
            try {
                const { data, error } = await db.from('estado_actual_ascensores').select('*');
                if (error) throw error;

                if (!data || data.length === 0) {
                    visor.innerHTML = '<p style="text-align:center;">No hay registros en la tabla estado_actual_ascensores.</p>';
                    return;
                }

                let ultimaFechaStr = '';
                let legajoOperador = null;

                data.forEach(item => {
                    let fechaItem = item.updated_at || item.actualizado_at || item.actualizado_en || item.fecha;
                    if (fechaItem) {
                        if (!ultimaFechaStr || new Date(fechaItem) > new Date(ultimaFechaStr)) {
                            ultimaFechaStr = fechaItem;
                        }
                    }
                    let legajoItem = item.legajo_operador || item.legajo;
                    if (legajoItem && !legajoOperador) {
                        legajoOperador = String(legajoItem).trim();
                    }
                });

                let nombreSupervisor = 'Sistema / Desconocido';
                if (legajoOperador) {
                    const { data: userData, error: userError } = await db
                        .from('usuarios')
                        .select('nombre_completo')
                        .eq('legajo', legajoOperador)
                        .maybeSingle();

                    if (!userError && userData && userData.nombre_completo) {
                        nombreSupervisor = userData.nombre_completo;
                    } else {
                        nombreSupervisor = `Legajo: ${legajoOperador}`;
                    }
                }

                let fechaFormateada = 'Sin fecha registrada';
                if (ultimaFechaStr) {
                    let f = new Date(ultimaFechaStr);
                    if (!isNaN(f.getTime())) {
                        fechaFormateada = f.toLocaleString('es-AR', {
                            year: 'numeric', month: '2-digit', day: '2-digit',
                            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
                        });
                    } else {
                        fechaFormateada = ultimaFechaStr;
                    }
                }

                const tituloContenedor = document.querySelector('#visor-estado-ascensores').previousElementSibling;
                if (tituloContenedor) {
                    tituloContenedor.innerHTML = `Última actualización: <b>${fechaFormateada}</b> | Registrado por: <b>${nombreSupervisor}</b>`;
                }

                data.sort((a, b) => (a.id || 0) - (b.id || 0));

                let cVerde = 0, cAmarillo = 0, cRojo = 0, cMixto = 0;
                let totalAscensores = data.length;

                let html = '<table style="width:100%; border-collapse: collapse; text-align: left;">';
                html += '<thead><tr style="background: #1a3a5f; color: white;"><th style="padding: 10px; border: 1px solid #ddd; text-align: center; width: 15%;">Dispositivo</th><th style="padding: 10px; border: 1px solid #ddd; width: 25%;">Estado</th><th style="padding: 10px; border: 1px solid #ddd; width: 30%;">Uso Asignado</th><th style="padding: 10px; border: 1px solid #ddd; width: 30%;">Observaciones / Detalles</th></tr></thead><tbody>';

                data.forEach(item => {
                    let dispositivo = item.identificador_dispositivo || `Dispositivo ${item.id}`;
                    let estado = item.estado || '-';
                    let uso = item.uso || '-';
                    let observaciones = item.observaciones && item.observaciones !== 'EMPTY' ? item.observaciones : '-';

                    let estLower = String(estado).toLowerCase();
                    if (estLower.includes('funcionando') && !estLower.includes('ascensorista')) {
                        cVerde++;
                    } else if (estLower.includes('mantenimiento')) {
                        cAmarillo++;
                    } else if (estLower.includes('fuera') || estLower.includes('servicio')) {
                        cRojo++;
                    } else if (estLower.includes('ascensorista') || estLower.includes('mixto')) {
                        cMixto++;
                    } else {
                        cVerde++;
                    }

                    html += `<tr>
                        <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold; text-align: center;">${dispositivo}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${estado}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${uso}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${observaciones}</td>
                    </tr>`;
                });

                html += '</tbody></table>';

                html += `
                    <div style="margin-top: 30px; text-align: center; color: #1a3a5f; font-weight: bold; font-size: 20px; margin-bottom: 10px;">Estadísticas de Funcionalidad</div>
                    <div style="background: white; padding: 25px; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: center; align-items: center; gap: 50px; flex-wrap: wrap;">
                        <div style="font-weight:bold; color: #1a3a5f; font-size: 16px; line-height: 2.0; display: flex; flex-direction: column;">
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Funcionando: ${totalAscensores > 0 ? ((cVerde/totalAscensores)*100).toFixed(1) : 0}% (${cVerde})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">En Mantenimiento: ${totalAscensores > 0 ? ((cAmarillo/totalAscensores)*100).toFixed(1) : 0}% (${cAmarillo})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Fuera de Servicio: ${totalAscensores > 0 ? ((cRojo/totalAscensores)*100).toFixed(1) : 0}% (${cRojo})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Con Ascensorista: ${totalAscensores > 0 ? ((cMixto/totalAscensores)*100).toFixed(1) : 0}% (${cMixto})</div>
                        </div>
                        <div style="width: 220px; height: 220px;">
                            <canvas id="graficoEstadoAscensoresVivo"></canvas>
                        </div>
                    </div>`;

                visor.innerHTML = html;

                setTimeout(() => {
                    const ctx = document.getElementById('graficoEstadoAscensoresVivo')?.getContext('2d');
                    if (ctx) {
                        if (typeof chartAscVivo !== 'undefined' && chartAscVivo) chartAscVivo.destroy();
                        window.chartAscVivo = new Chart(ctx, {
                            type: 'pie',
                            data: { 
                                labels: ['Funcionando', 'Mantenimiento', 'Fuera de Servicio', 'Ascensoristas'], 
                                datasets: [{ 
                                    data: [cVerde, cAmarillo, cRojo, cMixto], 
                                    backgroundColor: ['#28a745', '#ffc107', '#dc3545', '#007bff'] 
                                }] 
                            },
                            options: { 
                                responsive: true, 
                                plugins: { legend: { position: 'bottom' } } 
                            }
                        });
                    }
                }, 50);

            } catch (err) {
                console.error("Error al obtener estado actual de ascensores:", err);
                visor.innerHTML = '<p style="text-align:center; color: red;">Error al cargar los datos de ascensores y escaleras.</p>';
            }
        }

        function actualizarPrint(id) {
            const depto = document.getElementById('depto-destino-' + id).value;
            const turno = document.getElementById('turno-destino-' + id).value;
            const header = document.getElementById('print-header-' + id);
            if (header) header.innerText = `Dirigido a: ${depto} | Turno: ${turno}`;
        }

        function previsualizar(input, id) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                archivoData[id] = { name: file.name, type: file.type, data: e.target.result };
                const prev = document.getElementById('preview-' + id);
                if (prev) {
                    prev.style.display = 'block';
                    prev.innerHTML = file.type.startsWith('image') ? `<img src="${e.target.result}" style="max-width:200px; display:block; margin-top:10px;">` : `Archivo adjunto: ${file.name}`;
                }
            };
            reader.readAsDataURL(file);
        }

        function previsualizarMultiples(input, id) {
            if (!input.files || input.files.length === 0) return;
            if (!archivosCacheMap[id]) archivosCacheMap[id] = [];

            Array.from(input.files).forEach(file => {
                if (archivosCacheMap[id].length >= 5) {
                    alert("Solo se permite adjuntar un máximo de 5 archivos.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    archivosCacheMap[id].push({
                        name: file.name,
                        type: file.type,
                        data: e.target.result
                    });
                    renderizarChipsArchivos(id);
                };
                reader.readAsDataURL(file);
            });
            input.value = '';
        }

        function renderizarChipsArchivos(id) {
            const contenedorChips = document.getElementById('chips-' + id);
            if (!contenedorChips) return;
            const lista = archivosCacheMap[id] || [];
            if (lista.length === 0) {
                contenedorChips.innerHTML = '';
                return;
            }
            let html = '';
            lista.forEach((fileObj, index) => {
                html += `<div class="chip-archivo"><span>📎 ${fileObj.name}</span><button type="button" onclick="removerArchivoIndividual('${id}', ${index})">&times;</button></div>`;
            });
            contenedorChips.innerHTML = html;
        }

        function removerArchivoIndividual(id, index) {
            if (archivosCacheMap[id]) {
                archivosCacheMap[id].splice(index, 1);
                renderizarChipsArchivos(id);
            }
        }

        async function guardarRedaccion(id) {
            const destino = document.getElementById('depto-destino-' + id).value;
            const turno = document.getElementById('turno-destino-' + id).value;
            const textoVal = document.getElementById('txt-' + id).value;
            const listaArchivos = (id === 'novedades') ? (archivosCacheMap[id] || []) : (archivoData[id] ? [archivoData[id]] : []);

            if (!textoVal.trim() && listaArchivos.length === 0) {
                alert("Debe escribir contenido o adjuntar al menos un archivo antes de guardar.");
                return;
            }

            const timestampUnico = Date.now();
            const data = {
                texto: textoVal,
                archivos: listaArchivos,
                archivo: listaArchivos.length > 0 ? listaArchivos[0] : null,
                fecha: new Date().toLocaleString(),
                departamento: destino,
                turno: turno,
                estado_activo: true
            };
            
            let nombreDeptoClave = destino;
            if (destino === 'division-ascensores') nombreDeptoClave = 'Ascensores';
            if (destino === 'camilleros-central') nombreDeptoClave = 'Camilleros';
            if (destino === 'intendencia') nombreDeptoClave = 'Intendencia';
            if (destino === 'lavadero-central') nombreDeptoClave = 'Lavadero';
            if (destino === 'conmutador') nombreDeptoClave = 'Conmutador';
            if (destino === 'dalo') nombreDeptoClave = 'DALO';
            if (destino === 'direccion-servicios-generales') nombreDeptoClave = 'DSG';
            if (destino === 'Todos') nombreDeptoClave = 'Todos';

            const claveUnica = `comunicado_${id}_${nombreDeptoClave}_${turno}_${timestampUnico}`;
            
            const { error } = await db
                .from('comunicados_memos')
                .upsert(
                    { id_clave: claveUnica, contenido: data },
                    { onConflict: 'id_clave' }
                );

            if (error) {
                console.error("Error al guardar en Supabase:", error);
                alert("Error al enviar a la base de datos: " + error.message);
            } else {
                alert("Novedad guardada y enviada correctamente.");
                limpiarPantalla(id);
                if (id === 'novedades') {
                    cargarHistorialMuro(id);
                }
            }
        }

        async function cargarHistorialMuro(id) {
            const muroContenedor = document.getElementById('historial-muro-' + id);
            if (!muroContenedor) return;
            muroContenedor.innerHTML = '<p style="color: #64748b; font-size: 13px;">Cargando historial activo...</p>';

            try {
                const { data, error } = await db
                    .from('comunicados_memos')
                    .select('*')
                    .ilike('id_clave', `comunicado_${id}_%`)
                    .order('id_clave', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    muroContenedor.innerHTML = '<p style="color: #64748b; font-size: 13px;">No hay novedades previas registradas.</p>';
                    return;
                }

                let html = '';
                data.forEach(row => {
                    const contenido = row.contenido || {};
                    if (contenido.estado_activo === false) return; // Omitir borrados lógicos

                    const fechaStr = contenido.fecha || 'Fecha desconocida';
                    const deptoStr = contenido.departamento || 'Todos';
                    const turnoStr = contenido.turno || 'Todos';
                    const textoStr = contenido.texto || '';
                    const archivosArr = contenido.archivos || (contenido.archivo ? [contenido.archivo] : []);

                    html += `<div class="muro-tarjeta">
                        <div class="muro-tarjeta-header">
                            <span><b>Destino:</b> ${deptoStr} | <b>Turno:</b> ${turnoStr} | <b>Enviado:</b> ${fechaStr}</span>
                            <button class="btn-borrar-muro" onclick="borradoLogicoItem('${row.id_clave}', '${id}')">Eliminar</button>
                        </div>
                        <div class="muro-tarjeta-body">${textoStr || '(Sin texto descriptivo)'}</div>`;

                    if (archivosArr.length > 0) {
                        html += `<div class="muro-tarjeta-footer"><b>Adjuntos:</b>`;
                        archivosArr.forEach((fileItem, fIdx) => {
                            html += `<a href="${fileItem.data}" download="${fileItem.name}" style="background: #e2e8f0; color: #1a3a5f; padding: 3px 8px; border-radius: 4px; text-decoration: none; font-size: 12px; margin-left: 5px;">📥 ${fileItem.name}</a>`;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });

                muroContenedor.innerHTML = html || '<p style="color: #64748b; font-size: 13px;">No hay novedades activas para mostrar.</p>';

            } catch (err) {
                console.error("Error al cargar historial del muro:", err);
                muroContenedor.innerHTML = '<p style="color: #ef4444; font-size: 13px;">Error al cargar las novedades históricas.</p>';
            }
        }

        async function borradoLogicoItem(idClave, seccionId) {
            if (!confirm("¿Estás seguro de que deseas dar de baja esta novedad del muro?")) return;

            try {
                // Primero obtenemos el registro actual para modificar su propiedad estado_activo
                const { data: currentData, error: fetchError } = await db
                    .from('comunicados_memos')
                    .select('contenido')
                    .eq('id_clave', idClave)
                    .single();

                if (fetchError) throw fetchError;

                let contenidoActual = currentData.contenido || {};
                contenidoActual.estado_activo = false;

                const { error: updateError } = await db
                    .from('comunicados_memos')
                    .update({ contenido: contenidoActual })
                    .eq('id_clave', idClave);

                if (updateError) throw updateError;

                alert("Novedad eliminada correctamente.");
                cargarHistorialMuro(seccionId);
            } catch (err) {
                console.error("Error al eliminar novedad:", err);
                alert("No se pudo eliminar la novedad: " + err.message);
            }
        }

        async function generarReporteMensual() {
            const tipo = document.getElementById('est-tipo').value;
            const deptoSeleccionado = document.getElementById('est-depto').value;
            const turnoSeleccionado = document.getElementById('est-turno').value;
            const mes = document.getElementById('est-mes').value;
            const anio = document.getElementById('est-anio').value;
            const visor = document.getElementById('visor-estadisticas');
            
            visor.innerHTML = "<p>Cargando datos desde la nube...</p>";

            if (tipo === 'rrhh') {
                let p = 0, a = 0, l = 0;
                const { data: asistData } = await db.from('rrhh_asistencia').select('*');
                if (asistData) {
                    asistData.forEach(ag => {
                        const f = new Date(ag.fecha);
                        const matchFecha = (f.getMonth() + 1) == mes && f.getFullYear() == anio;
                        const matchTurno = (turnoSeleccionado === 'Todos' || ag.turno === turnoSeleccionado);
                        const matchDepto = (deptoSeleccionado === 'Todos' || ag.departamento === deptoSeleccionado);

                        if (matchFecha && matchTurno && matchDepto) {
                            const est = String(ag.estado_asistencia || '').trim().toLowerCase();
                            if (est === 'presente' || est === 'p') p++;
                            else if (est === 'ausente' || est === 'a') a++;
                            else if (est === 'licencia' || est === 'l') l++;
                        }
                    });
                }
                
                if (p+a+l === 0) { visor.innerHTML = "No hay datos para esta selección."; return; }
                visor.innerHTML = `<h3>Asistencia (${deptoSeleccionado}) ${mes}/${anio}</h3><div style="width:300px; height:300px; margin:auto;"><canvas id="graficoMes"></canvas></div><p><b>Presentismo:</b> ${((p/(p+a+l))*100).toFixed(1)}%</p>`;
                new Chart(document.getElementById('graficoMes'), { type: 'doughnut', data: { labels: ['Presentes', 'Ausentes', 'Licencias'], datasets: [{ data: [p, a, l], backgroundColor: ['#28a745', '#dc3545', '#ffc107'] }] } });
            
            } else if (tipo === 'ascensores') {
                const { data: ascData } = await db.from('registros_ascensores').select('*');
                let func = 0, falla = 0;
                if (ascData) {
                    ascData.forEach(item => {
                        const f = new Date(item.fecha_cierre);
                        const matchFecha = (f.getMonth() + 1) == mes && f.getFullYear() == anio;
                        const matchTurno = (turnoSeleccionado === 'Todos' || item.turno === turnoSeleccionado);
                        const matchDepto = (deptoSeleccionado === 'Todos' || item.departamento === deptoSeleccionado);

                        if (matchFecha && matchTurno && matchDepto) {
                            const txt = String(item.estado || '').trim().toLowerCase();
                            if (txt.includes('funciona') || txt.includes('ok') || txt === 'p') func++;
                            else if (txt.includes('falla') || txt.includes('fuera') || txt === 'a' || txt === 'l') falla++;
                        }
                    });
                }

                if (func+falla === 0) { visor.innerHTML = "No hay registros para esta selección."; return; }
                visor.innerHTML = `<h3>Estado Ascensores (${deptoSeleccionado}) ${mes}/${anio}</h3><div style="width:300px; height:300px; margin:auto;"><canvas id="graficoMes"></canvas></div><p><b>% Funcionamiento:</b> ${((func/(func+falla))*100).toFixed(1)}%</p>`;
                new Chart(document.getElementById('graficoMes'), { type: 'pie', data: { labels: ['En Servicio', 'En Falla'], datasets: [{ data: [func, falla], backgroundColor: ['#28a745', '#dc3545'] }] } });
            }
        }

        let chartAsc; 

        async function consultar(tipo) {
            const depto = document.getElementById('depto-' + tipo).value;
            const turno = document.getElementById('turno-' + tipo).value;
            const fechaBusqueda = document.getElementById('fecha-' + tipo).value;
            const supervisorSeleccionado = document.getElementById('supervisor-' + tipo)?.value || '';
            const visor = document.getElementById('visor-' + tipo);
            
            if (!fechaBusqueda) {
                visor.innerHTML = `<p style='color: red; font-weight: bold;'>Por favor, seleccione una fecha válida.</p>`;
                return;
            }

            visor.innerHTML = "<p>Buscando en la base de datos...</p>";
            
            let deptoFiltro = depto;
            if (depto === 'division-ascensores') deptoFiltro = 'Ascensores';
            if (depto === 'intendencia') deptoFiltro = 'Intendencia';
            if (depto === 'direccion-servicios-generales') deptoFiltro = 'Dirección Servicios Generales';
            if (depto === 'lavadero-central') deptoFiltro = 'Lavadero Central';
            if (depto === 'camilleros-central') deptoFiltro = 'Camilleros';
            if (depto === 'conmutador') deptoFiltro = 'Conmutador';
            if (depto === 'dalo') deptoFiltro = 'DALO';
            
            let queryReg = db
                .from('cierres_jornada')
                .select('*')
                .eq('fecha_cierre', fechaBusqueda)
                .eq('turno', turno)
                .eq('departamento', deptoFiltro);

            if (deptoFiltro === 'Intendencia' && supervisorSeleccionado) {
                queryReg = queryReg.eq('supervisor', supervisorSeleccionado);
            }

            const { data: reg, error } = await queryReg.maybeSingle();
            
            if (tipo === 'rrhh') {
                if (error || !reg || !reg.asistencia_personal) {
                    visor.innerHTML = `<p style='color: red; font-weight: bold;'>No se encontraron registros de asistencia en la nube para esta selección.</p>`;
                    return;
                }

                const jsonAsistencia = reg.asistencia_personal;
                const legajos = Object.keys(jsonAsistencia);

                if (legajos.length === 0) {
                    visor.innerHTML = "<p style='color: red; font-weight: bold;'>El registro de asistencia está vacío.</p>";
                    return;
                }

                let tablaPersonal = 'intendencia_personal';
                if (deptoFiltro === 'Ascensores') {
                    tablaPersonal = 'ascensores_personal';
                } else if (deptoFiltro === 'Camilleros') {
                    tablaPersonal = 'camilleros_personal';
                } else if (deptoFiltro === 'Lavadero Central') {
                    tablaPersonal = 'lavadero_personal';
                }

                const { data: resPersonal, error: errPers } = await db
                    .from(tablaPersonal)
                    .select('legajo, apellido_y_nombre')
                    .in('legajo', legajos);

                const mapaNombres = {};
                if (resPersonal) {
                    resPersonal.forEach(p => {
                        if (p.legajo != null) mapaNombres[String(p.legajo).trim()] = p.apellido_y_nombre || 'Desconocido';
                    });
                }

                let presentes = 0, ausentes = 0, licencias = 0;
                let total = legajos.length;

                let html = `<table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                    <thead>
                        <tr>
                            <th style="border: 1px solid #000; padding: 8px; background-color: #1a3a5f; color: white;">LEGAJO</th>
                            <th style="border: 1px solid #000; padding: 8px; background-color: #1a3a5f; color: white;">APELLIDO Y NOMBRE</th>
                            <th style="border: 1px solid #000; padding: 8px; background-color: #1a3a5f; color: white; width: 80px;">PRESENTE</th>
                            <th style="border: 1px solid #000; padding: 8px; background-color: #1a3a5f; color: white; width: 80px;">AUSENTE</th>
                            <th style="border: 1px solid #000; padding: 8px; background-color: #1a3a5f; color: white; width: 80px;">LICENCIA</th>
                        </tr>
                    </thead>
                    <tbody>`;
                
                legajos.forEach(legajo => {
                    const legTrim = String(legajo).trim();
                    let nombre = mapaNombres[legTrim];
                    if (!nombre && typeof agentesGlobal !== 'undefined') {
                        const encontradoGlobal = agentesGlobal.find(ag => String(ag.legajo).trim() === legTrim);
                        if (encontradoGlobal) nombre = encontradoGlobal.nombre;
                    }
                    if (!nombre) nombre = `Legajo N° ${legTrim}`;
                    
                    const estRaw = String(jsonAsistencia[legajo] || 'P').trim().toUpperCase();
                    let estadoChar = (estRaw === 'A' || estRaw === 'L' || estRaw === 'P') ? estRaw : 'P';

                    if (estadoChar === 'P') presentes++; 
                    else if (estadoChar === 'A') ausentes++; 
                    else if (estadoChar === 'L') licencias++;

                    html += `<tr>
                        <td style="border: 1px solid #000; padding: 8px; text-align: center;">${legTrim}</td>
                        <td style="border: 1px solid #000; padding: 8px; text-align: center;">${nombre}</td>
                        <td style="border: 1px solid #000; padding: 8px; text-align: center;"><div class="box-estado ${estadoChar === 'P' ? 'box-P' : ''}"></div></td>
                        <td style="border: 1px solid #000; padding: 8px; text-align: center;"><div class="box-estado ${estadoChar === 'A' ? 'box-A' : ''}"></div></td>
                        <td style="border: 1px solid #000; padding: 8px; text-align: center;"><div class="box-estado ${estadoChar === 'L' ? 'box-L' : ''}"></div></td>
                    </tr>`;
                });
                
                html += `</tbody></table>`;
                
                html += `
                    <div style="margin-top: 30px; text-align: center; color: #1a3a5f; font-weight: bold; font-size: 20px; margin-bottom: 10px;">Estadísticas de Presentismo</div>
                    <div style="background: white; padding: 25px; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: center; align-items: center; gap: 50px; flex-wrap: wrap;">
                        <div style="font-weight:bold; color: #1a3a5f; font-size: 16px; line-height: 2.0; display: flex; flex-direction: column;">
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Presentismo: ${total > 0 ? ((presentes/total)*100).toFixed(1) : 0}% (${presentes})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Ausentismo: ${total > 0 ? ((ausentes/total)*100).toFixed(1) : 0}% (${ausentes})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Licencias: ${total > 0 ? ((licencias/total)*100).toFixed(1) : 0}% (${licencias})</div>
                        </div>
                        <div style="width: 220px; height: 220px;">
                            <canvas id="graficoRrhh"></canvas>
                        </div>
                    </div>`;

                visor.innerHTML = html;

                setTimeout(() => {
                    const ctx = document.getElementById('graficoRrhh')?.getContext('2d');
                    if (ctx) {
                        if (typeof chartRrhh !== 'undefined' && chartRrhh) chartRrhh.destroy();
                        window.chartRrhh = new Chart(ctx, {
                            type: 'pie',
                            data: { 
                                labels: ['Presentes', 'Ausentes', 'Licencias'], 
                                datasets: [{ 
                                    data: [presentes, ausentes, licencias], 
                                    backgroundColor: ['#28a745', '#dc3545', '#ffc107'] 
                                }] 
                            },
                            options: { 
                                responsive: true, 
                                plugins: { legend: { position: 'bottom' } } 
                            }
                        });
                    }
                }, 50);
            
            } else if (tipo === 'planillas') {
                if (deptoFiltro === 'Ascensores') {
                    const { data: dispData } = await db.from('registros_ascensores').select('*').eq('fecha_cierre', fechaBusqueda).eq('turno', turno);

                    let tablaDinamica = `<table style="width: 100%; border-collapse: collapse; margin-top: 15px;"><thead><tr><th style="border: 1px solid #333; padding: 10px; background-color: #1a3a5f; color: white;">N° de Ascensor</th><th style="border: 1px solid #333; padding: 10px; background-color: #1a3a5f; color: white;">Estado</th><th style="border: 1px solid #333; padding: 10px; background-color: #1a3a5f; color: white;">Uso Asignado</th><th style="border: 1px solid #333; padding: 10px; background-color: #1a3a5f; color: white;">Observaciones / Detalle</th></tr></thead><tbody>`;
                    
                    let cVerde = 0, cAmarillo = 0, cRojo = 0, cMixto = 0;
                    let totalAscensores = dispData ? dispData.length : 0;

                    if (dispData && dispData.length > 0) {
                        dispData.forEach(item => {
                            let estadoNormalizado = String(item.estado || '').trim();
                            let textoOriginal = item.observaciones || '-';
                            let usoAsignado = textoOriginal;
                            let detalleObs = '-';

                            if (textoOriginal.includes('(')) {
                                let indiceParentesis = textoOriginal.indexOf('(');
                                usoAsignado = textoOriginal.substring(0, indiceParentesis).trim();
                                detalleObs = textoOriginal.substring(indiceParentesis).trim();
                            }

                            let estLower = estadoNormalizado.toLowerCase();
                            if (estLower.includes('funcionando') && !estLower.includes('ascensorista')) {
                                cVerde++;
                            } else if (estLower.includes('mantenimiento')) {
                                cAmarillo++;
                            } else if (estLower.includes('fuera') || estLower.includes('servicio')) {
                                cRojo++;
                            } else if (estLower.includes('ascensorista') || estLower.includes('mixto')) {
                                cMixto++;
                            } else {
                                cVerde++;
                            }

                            tablaDinamica += `<tr><td style="border: 1px solid #333; padding: 8px; text-align: center;">${item.identificador_dispositivo}</td><td style="border: 1px solid #333; padding: 8px; text-align: center;">${estadoNormalizado}</td><td style="border: 1px solid #333; padding: 8px; text-align: center;">${usoAsignado}</td><td style="border: 1px solid #333; padding: 8px; text-align: center;">${detalleObs}</td></tr>`;
                        });
                    } else {
                        tablaDinamica += `<tr><td colspan="4" style="border: 1px solid #333; padding: 12px; text-align: center;">No hay registros detallados de ascensores para esta fecha.</td></tr>`;
                    }
                    tablaDinamica += `</tbody></table>`;

                    tablaDinamica += `
                        <div style="margin-top: 30px; text-align: center; color: #1a3a5f; font-weight: bold; font-size: 20px; margin-bottom: 10px;">Estadísticas de Funcionalidad</div>
                        <div style="background: white; padding: 25px; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: center; align-items: center; gap: 50px; flex-wrap: wrap;">
                            <div style="font-weight:bold; color: #1a3a5f; font-size: 16px; line-height: 2.0; display: flex; flex-direction: column;">
                                <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Funcionando: ${totalAscensores > 0 ? ((cVerde/totalAscensores)*100).toFixed(1) : 0}% (${cVerde})</div>
                                <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">En Mantenimiento: ${totalAscensores > 0 ? ((cAmarillo/totalAscensores)*100).toFixed(1) : 0}% (${cAmarillo})</div>
                                <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Fuera de Servicio: ${totalAscensores > 0 ? ((cRojo/totalAscensores)*100).toFixed(1) : 0}% (${cRojo})</div>
                                <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Con Ascensorista: ${totalAscensores > 0 ? ((cMixto/totalAscensores)*100).toFixed(1) : 0}% (${cMixto})</div>
                            </div>
                            <div style="width: 220px; height: 220px;">
                                <canvas id="graficoAscensores"></canvas>
                            </div>
                        </div>`;

                    visor.innerHTML = tablaDinamica;

                    setTimeout(() => {
                        const ctx = document.getElementById('graficoAscensores')?.getContext('2d');
                        if (ctx) {
                            if (typeof chartAsc !== 'undefined' && chartAsc) chartAsc.destroy();
                            window.chartAsc = new Chart(ctx, {
                                type: 'pie',
                                data: { 
                                    labels: ['Funcionando', 'Mantenimiento', 'Fuera de Servicio', 'Ascensoristas'], 
                                    datasets: [{ 
                                        data: [cVerde, cAmarillo, cRojo, cMixto], 
                                        backgroundColor: ['#28a745', '#ffc107', '#dc3545', '#007bff'] 
                                    }] 
                                },
                                options: { 
                                    responsive: true, 
                                    plugins: { legend: { position: 'bottom' } } 
                                }
                            });
                        }
                    }, 50);

                } else if (deptoFiltro === 'Intendencia') {
                    let queryInt = db.from('registros_intendencia').select('*').eq('fecha_cierre', fechaBusqueda).eq('turno', turno);
                    if (supervisorSeleccionado) queryInt = queryInt.eq('supervisor', supervisorSeleccionado);
                    const { data: intData } = await queryInt;

                    let tablaDinamica = `
                        <div style="background: #fff; width: 100%; box-sizing: border-box;">
                            <div style="font-size: 16px; font-weight: bold; color: #1a3a5f; margin-bottom: 10px;">Planilla Operativa - Intendencia ${supervisorSeleccionado ? '(' + supervisorSeleccionado + ')' : ''}</div>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 0;">
                                <thead>
                                    <tr style="background-color: #1a3a5f; color: white;">
                                        <th style="border: 1px solid #333; padding: 10px; text-align: center;" rowspan="2">SECTOR</th>
                                        <th style="border: 1px solid #333; padding: 10px; text-align: center;" rowspan="2">AGENTES ASIGNADOS</th>
                                        <th style="border: 1px solid #333; padding: 8px; text-align: center;" colspan="2">HORARIO</th>
                                    </tr>
                                    <tr style="background-color: #1a3a5f; color: white;">
                                        <th style="border: 1px solid #333; padding: 8px; text-align: center; width: 100px;">DESDE</th>
                                        <th style="border: 1px solid #333; padding: 8px; text-align: center; width: 100px;">HASTA</th>
                                    </tr>
                                </thead>
                               <tbody>`;
                    
                    if (intData && intData.length > 0) {
                        intData.forEach(row => {
                            tablaDinamica += `<tr>
                                <td style="border: 1px solid #333; padding: 10px; text-align: center;">${row.sector || ''}</td>
                                <td style="border: 1px solid #333; padding: 10px; text-align: center;">${row.agentes_asignados || ''}</td>
                                <td style="border: 1px solid #333; padding: 10px; text-align: center;">${row.hora_desde || ''}</td>
                                <td style="border: 1px solid #333; padding: 10px; text-align: center;">${row.hora_hasta || ''}</td>
                            </tr>`;
                        });
                    } else {
                        tablaDinamica += `<tr><td colspan="4" style="border: 1px solid #333; padding: 12px; text-align: center;">No hay registros detallados de Intendencia para esta fecha y turno con este supervisor.</td></tr>`;
                    }
                    tablaDinamica += `</tbody></table>`;
                    
                    let obsFinal = '';
                    if (reg && reg.observaciones) obsFinal = reg.observaciones;
                    else if (intData && intData.length > 0) {
                        const encontrada = intData.find(r => r.observaciones && r.observaciones.trim() !== '');
                        obsFinal = encontrada ? encontrada.observaciones : '';
                    }

                    tablaDinamica += `
                        <div style="background-color: #1a3a5f; color: white; padding: 8px 12px; font-weight: bold; font-size: 14px; margin-top: 15px; border: 1px solid #333;">Observaciones:</div>
                        <div style="padding: 10px 15px; min-height: 120px; background: #fff; border: 1px solid #333; border-top: none; font-family: 'Courier New', Courier, monospace; font-size: 16px; line-height: 30px; background-image: linear-gradient(#e0e0e0 1px, transparent 1px); background-size: 100% 30px;">
                            <p style="margin: 0; padding: 0; white-space: pre-wrap;">${obsFinal || 'Sin observaciones registradas.'}</p>
                        </div>
                    </div>`;
                    visor.innerHTML = tablaDinamica;

                } else if (deptoFiltro === 'Camilleros') {
                    const { data: camData } = await db.from('registros_camilleros').select('*').eq('fecha_cierre', fechaBusqueda).eq('turno', turno);

                    let tablaDinamica = `
                        <div style="background: #fff; width: 100%; box-sizing: border-box;">
                            <div style="font-size: 16px; font-weight: bold; color: #1a3a5f; margin-bottom: 10px;">Planilla Operativa - Camilleros</div>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 0; font-size: 12px;">
                                <thead>
                                    <tr style="background-color: #1a3a5f; color: white;">
                                        <th style="border: 1px solid #333; padding: 8px 4px; text-align: center; width: 10%;">HORA</th>
                                        <th style="border: 1px solid #333; padding: 8px 4px; text-align: center; width: 15%;">PISO/SALA/CAMA</th>
                                        <th style="border: 1px solid #333; padding: 8px 4px; text-align: center; width: 20%;">APELLIDO Y NOMBRE</th>
                                        <th style="border: 1px solid #333; padding: 8px 4px; text-align: center; width: 15%;">DESTINO</th>
                                        <th style="border: 1px solid #333; padding: 8px 4px; text-align: center; width: 10%;">HORA ESTADÍA</th>
                                        <th style="border: 1px solid #333; padding: 8px 4px; text-align: center; width: 10%;">MOVILIDAD</th>
                                        <th style="border: 1px solid #333; padding: 8px 4px; text-align: center; width: 11%;">CAMILLERO</th>
                                        <th style="border: 1px solid #333; padding: 8px 4px; text-align: center; width: 9%;">HORA DE FINALIZACION</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                    
                    if (camData && camData.length > 0) {
                        camData.forEach((row) => {
                            tablaDinamica += `<tr>
                                <td style="border: 1px solid #333; padding: 6px 4px; text-align: center;">${row.hora || ''}</td>
                                <td style="border: 1px solid #333; padding: 6px 4px; text-align: center;">${row.numero_cama || ''}</td>
                                <td style="border: 1px solid #333; padding: 6px 4px; text-align: center;">${row.nombre_paciente || ''}</td>
                                <td style="border: 1px solid #333; padding: 6px 4px; text-align: center;">${row.destino || ''}</td>
                                <td style="border: 1px solid #333; padding: 6px 4px; text-align: center;">${row.duracion_estancia || ''}</td>
                                <td style="border: 1px solid #333; padding: 6px 4px; text-align: center;">${row.tipo_movilidad || ''}</td>
                                <td style="border: 1px solid #333; padding: 6px 4px; text-align: center;">${row.personal_asignado || ''}</td>
                                <td style="border: 1px solid #333; padding: 6px 4px; text-align: center;">${row.hora_finalizacion || ''}</td>
                            </tr>`;
                        });
                    } else {
                        tablaDinamica += `<tr><td colspan="8" style="border: 1px solid #333; padding: 12px; text-align: center;">No hay registros de movimientos de camilleros para esta fecha.</td></tr>`;
                    }
                    tablaDinamica += `</tbody></table>`;

                    let obsCamilleros = '';
                    if (reg && reg.observaciones) obsCamilleros = reg.observaciones;
                    else if (camData && camData.length > 0) {
                        const obsEncontrada = camData.find(r => r.observaciones && r.observaciones.trim() !== '');
                        obsCamilleros = obsEncontrada ? obsEncontrada.observaciones : '';
                    }

                    tablaDinamica += `
                        <div style="background-color: #1a3a5f; color: white; padding: 8px 12px; font-weight: bold; font-size: 14px; margin-top: 15px; border: 1px solid #333;">Observaciones de la Jornada:</div>
                        <div style="padding: 0px 15px; min-height: 120px; background: #fff; border: 1px solid #333; border-top: none; font-family: 'Courier New', Courier, monospace; font-size: 16px; line-height: 30px; background-image: linear-gradient(#e0e0e0 1px, transparent 1px); background-size: 100% 30px;">
                            <p style="margin: 0; padding: 0; white-space: pre-wrap;">${obsCamilleros || 'Sin observaciones registradas.'}</p>
                        </div>
                    </div>`;

                    visor.innerHTML = tablaDinamica;

                } else {
                    if (error || !reg) {
                        visor.innerHTML = `<p style='color: red; font-weight: bold;'>No se encontraron registros para ${deptoFiltro} en el turno ${turno} (${fechaBusqueda}).</p>`;
                        return;
                    }

                    let tablaDinamica = `
                        <div style="background: #fff; width: 100%; box-sizing: border-box;">
                            <div style="font-size: 16px; font-weight: bold; color: #1a3a5f; margin-bottom: 10px;">Planilla Operativa (${reg.departamento})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 12px; font-weight: bold; font-size: 14px; margin-top: 15px; border: 1px solid #333;">Observaciones y Contenido:</div>
                            <div style="padding: 0px 15px; min-height: 100px; background: #fff; border: 1px solid #333; border-top: none; font-family: 'Courier New', Courier, monospace; font-size: 16px; line-height: 30px; background-image: linear-gradient(#e0e0e0 1px, transparent 1px); background-size: 100% 30px;">
                                <p style="margin: 0; padding: 0; white-space: pre-wrap;">${reg.observaciones || 'Sin datos adicionales.'}</p>
                            </div>
                        </div>
                    `;
                    visor.innerHTML = tablaDinamica;
                }

            } else if (tipo === 'reportes' || tipo === 'insumos') {
                if (error || !reg) {
                    visor.innerHTML = `<p style='color: red; font-weight: bold;'>No se encontraron registros para ${deptoFiltro} en el turno ${turno} (${fechaBusqueda}).</p>`;
                    return;
                }
                visor.innerHTML = `<h3>Reporte Diario - Vista de Auditoría</h3><style>.hoja-modelo-limpio { width: 100% !important; background-color: #fff !important; border: 1px solid #ccc !important; padding: 30px !important; position: relative !important; min-height: 800px !important; font-family: 'Courier New', Courier, monospace !important; font-size: 16px !important; line-height: 30px !important; box-sizing: border-box !important; background-image: linear-gradient(to right, transparent 0px, transparent 0px), linear-gradient(#e0e0e0 1px, transparent 1px) !important; background-size: 100% 30px !important; white-space: pre-wrap !important; }</style><div class="hoja-modelo-limpio">${reg.reporte_diario || 'No hay contenido de reporte.'}</div>`;
            }
        }
        document.getElementById('reportes').classList.add('activo');
    </script>
</body>
</html>
