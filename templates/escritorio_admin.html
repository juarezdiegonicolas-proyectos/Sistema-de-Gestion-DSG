    <script>
        let archivoData = {};[cite: 10]
        let archivosMultiplesNovedades = [];[cite: 10]

        function mostrar(id, titulo) {[cite: 10]
            document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activo'));[cite: 10]
            document.getElementById(id).classList.add('activo');[cite: 10]
            document.getElementById('titulo-panel').innerText = titulo;[cite: 10]
            if (id === 'estado-ascensores') {[cite: 10]
                cargarEstadoAscensoresVivo();[cite: 10]
            }
            if (id === 'novedades') {[cite: 10]
                cargarHistorialMuroNovedades();[cite: 10]
            }
        }
        function limpiarPantalla(id) {[cite: 10]
            document.getElementById('txt-' + id).value = '';[cite: 10]
            document.getElementById('print-' + id).innerText = '';[cite: 10]
            document.getElementById('preview-' + id).style.display = 'none';[cite: 10]
            document.getElementById('preview-' + id).innerHTML = '';[cite: 10]
            document.getElementById('depto-destino-' + id).value = 'Todos';[cite: 10]
            document.getElementById('turno-destino-' + id).value = 'Todos';[cite: 10]
            actualizarPrint(id);[cite: 10]
            delete archivoData[id];[cite: 10]
            if (id === 'novedades') {[cite: 10]
                archivosMultiplesNovedades = [];[cite: 10]
            }
        }

        async function previsualizarMultiples(input, id) {[cite: 10]
            if (!input.files || input.files.length === 0) return;[cite: 10]
            archivosMultiplesNovedades = [];[cite: 10]
            const prev = document.getElementById('preview-' + id);[cite: 10]
            prev.style.display = 'block';[cite: 10]
            prev.innerHTML = '<b>Archivos seleccionados:</b><ul style="margin: 5px 0 0 20px; padding:0;"></ul>';[cite: 10]
            const listaUl = prev.querySelector('ul');[cite: 10]

            for (let i = 0; i < input.files.length; i++) {[cite: 10]
                const file = input.files[i];[cite: 10]
                const reader = new FileReader();[cite: 10]
                
                (function(f) {[cite: 10]
                    reader.onload = function(e) {[cite: 10]
                        archivosMultiplesNovedades.push({[cite: 10]
                            name: f.name,[cite: 10]
                            type: f.type,[cite: 10]
                            data: e.target.result[cite: 10]
                        });
                        const li = document.createElement('li');[cite: 10]
                        li.textContent = f.name;[cite: 10]
                        listaUl.appendChild(li);[cite: 10]
                    };
                    reader.readAsDataURL(f);[cite: 10]
                })(file);
            }
        }

        async function cargarHistorialMuroNovedades() {[cite: 10]
            const contenedorMuro = document.getElementById('historial-muro-novedades');[cite: 10]
            contenedorMuro.innerHTML = 'Cargando registros históricos...';[cite: 10]

            try {
                const { data, error } = await db[cite: 10]
                    .from('comunicados_memos')[cite: 10]
                    .select('*')[cite: 10]
                    .ilike('id_clave', 'comunicado_novedades_%')[cite: 10]
                    .order('created_at', { ascending: false });[cite: 10]

                if (error) throw error;[cite: 10]

                if (!data || data.length === 0) {[cite: 10]
                    contenedorMuro.innerHTML = '<p style="color: #666; font-style: italic;">No hay envíos registrados en el muro de novedades.</p>';[cite: 10]
                    return;
                }

                let html = '';[cite: 10]
                data.forEach(row => {[cite: 10]
                    const contenido = row.contenido || {};[cite: 10]
                    const texto = contenido.texto || 'Sin texto';[cite: 10]
                    const fecha = contenido.fecha || row.created_at || 'Fecha desconocida';[cite: 10]
                    const depto = contenido.departamento || 'Todos';[cite: 10]
                    const turno = contenido.turno || 'Todos';[cite: 10]

                    let adjuntosHtml = '';[cite: 10]
                    if (contenido.archivos && Array.isArray(contenido.archivos) && contenido.archivos.length > 0) {[cite: 10]
                        adjuntosHtml = '<div class="muro-adjuntos"><b>Archivos:</b> ';[cite: 10]
                        contenido.archivos.forEach(adj => {[cite: 10]
                            adjuntosHtml += `<a href="${adj.data}" download="${adj.name}" target="_blank">📥 ${adj.name}</a>`;[cite: 10]
                        });
                        adjuntosHtml += '</div>';[cite: 10]
                    } else if (contenido.archivo && contenido.archivo.name) {[cite: 10]
                        adjuntosHtml = `<div class="muro-adjuntos"><b>Archivo:</b> <a href="${contenido.archivo.data}" download="${contenido.archivo.name}" target="_blank">📥 ${contenido.archivo.name}</a></div>`;[cite: 10]
                    }

                    html += `
                        <div class="muro-item">
                            <div class="muro-header">
                                <span><b>Destino:</b> ${depto} | <b>Turno:</b> ${turno}</span>
                                <span>${fecha}</span>
                            </div>
                            <div class="muro-body">${texto}</div>
                            ${adjuntosHtml}
                        </div>
                    `;
                });

                contenedorMuro.innerHTML = html;[cite: 10]
            } catch (err) {
                console.error("Error al cargar historial del muro de novedades:", err);[cite: 10]
                contenedorMuro.innerHTML = '<p style="color: red;">Error al cargar el historial del muro.</p>';[cite: 10]
            }
        }

        async function cargarEstadoAscensoresVivo() {[cite: 10]
            const visor = document.getElementById('visor-estado-ascensores');[cite: 10]
            visor.innerHTML = '<p style="text-align:center;">Cargando estado actual de ascensores...</p>';[cite: 10]
            
            try {
                const { data, error } = await db.from('estado_actual_ascensores').select('*');[cite: 10]
                if (error) throw error;[cite: 10]

                if (!data || data.length === 0) {[cite: 10]
                    visor.innerHTML = '<p style="text-align:center;">No hay registros en la tabla estado_actual_ascensores.</p>';[cite: 10]
                    return;
                }

                let ultimaFechaStr = '';[cite: 10]
                let legajoOperador = null;[cite: 10]

                data.forEach(item => {[cite: 10]
                    let fechaItem = item.updated_at || item.actualizado_at || item.actualizado_en || item.fecha;[cite: 10]
                    if (fechaItem) {[cite: 10]
                        if (!ultimaFechaStr || new Date(fechaItem) > new Date(ultimaFechaStr)) {[cite: 10]
                            ultimaFechaStr = fechaItem;[cite: 10]
                        }
                    }
                    let legajoItem = item.legajo_operador || item.legajo;[cite: 10]
                    if (legajoItem && !legajoOperador) {[cite: 10]
                        legajoOperador = String(legajoItem).trim();[cite: 10]
                    }
                });

                let nombreSupervisor = 'Sistema / Desconocido';[cite: 10]
                if (legajoOperador) {[cite: 10]
                    const { data: userData, error: userError } = await db[cite: 10]
                        .from('usuarios')[cite: 10]
                        .select('nombre_completo')[cite: 10]
                        .eq('legajo', legajoOperador)[cite: 10]
                        .maybeSingle();[cite: 10]

                    if (!userError && userData && userData.nombre_completo) {[cite: 10]
                        nombreSupervisor = userData.nombre_completo;[cite: 10]
                    } else {
                        nombreSupervisor = `Legajo: ${legajoOperador}`;[cite: 10]
                    }
                }

                let fechaFormateada = 'Sin fecha registrada';[cite: 10]
                if (ultimaFechaStr) {[cite: 10]
                    let f = new Date(ultimaFechaStr);[cite: 10]
                    if (!isNaN(f.getTime())) {[cite: 10]
                        fechaFormateada = f.toLocaleString('es-AR', {[cite: 10]
                            year: 'numeric', month: '2-digit', day: '2-digit',[cite: 10]
                            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false[cite: 10]
                        });
                    } else {
                        fechaFormateada = ultimaFechaStr;[cite: 10]
                    }
                }

                const tituloContenedor = document.querySelector('#visor-estado-ascensores').previousElementSibling;[cite: 10]
                if (tituloContenedor) {[cite: 10]
                    tituloContenedor.innerHTML = `Última actualización: <b>${fechaFormateada}</b> | Registrado por: <b>${nombreSupervisor}</b>`;[cite: 10]
                }

                data.sort((a, b) => (a.id || 0) - (b.id || 0));[cite: 10]

                let cVerde = 0, cAmarillo = 0, cRojo = 0, cMixto = 0;[cite: 10]
                let totalAscensores = data.length;[cite: 10]

                let html = '<table style="width:100%; border-collapse: collapse; text-align: left;">';[cite: 10]
                html += '<thead><tr style="background: #1a3a5f; color: white;"><th style="padding: 10px; border: 1px solid #ddd; text-align: center; width: 15%;">Dispositivo</th><th style="padding: 10px; border: 1px solid #ddd; width: 25%;">Estado</th><th style="padding: 10px; border: 1px solid #ddd; width: 30%;">Uso Asignado</th><th style="padding: 10px; border: 1px solid #ddd; width: 30%;">Observaciones / Detalles</th></tr></thead><tbody>';[cite: 10]

                data.forEach(item => {[cite: 10]
                    let dispositivo = item.identificador_dispositivo || `Dispositivo ${item.id}`;[cite: 10]
                    let estado = item.estado || '-';[cite: 10]
                    let uso = item.uso || '-';[cite: 10]
                    let observaciones = item.observaciones && item.observaciones !== 'EMPTY' ? item.observaciones : '-';[cite: 10]

                    let estLower = String(estado).toLowerCase();[cite: 10]
                    if (estLower.includes('funcionando') && !estLower.includes('ascensorista')) {[cite: 10]
                        cVerde++;[cite: 10]
                    } else if (estLower.includes('mantenimiento')) {[cite: 10]
                        cAmarillo++;[cite: 10]
                    } else if (estLower.includes('fuera') || estLower.includes('servicio')) {[cite: 10]
                        cRojo++;[cite: 10]
                    } else if (estLower.includes('ascensorista') || estLower.includes('mixto')) {[cite: 10]
                        cMixto++;[cite: 10]
                    } else {
                        cVerde++;[cite: 10]
                    }

                    html += `<tr>
                        <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold; text-align: center;">${dispositivo}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${estado}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${uso}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${observaciones}</td>
                    </tr>`;
                });

                html += '</tbody></table>';[cite: 10]

                html += `
                    <div style="margin-top: 30px; text-align: center; color: #1a3a5f; font-weight: bold; font-size: 20px; margin-bottom: 10px;">Estadísticas de Funcionalidad</div>
                    <div style="background: white; padding: 25px; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: center; align-items: center; gap: 50px; flex-wrap: wrap;">
                        <div style="font-weight:bold; color: #1a3a5f; font-size: 16px; line-height: 2.0; display: flex; flex-direction: column;">
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Funcionando: ${totalAscensores > 0 ? ((cVerde/totalAscensores)*100).toFixed(1) : 0}% (${cVerde})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">En Mantenimiento: ${totalAscensores > 0 ? ((cAmarillo/totalAscensores)*100).toFixed(1) : 0}% (${cAmarillo})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Fuera de Servicio: ${totalAscensores > 0 ? ((cRojo/totalAscensores)*100).toFixed(1) : 0}% (${cRojo})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 8px; width: 270px; text-align: left;">Con Ascensorista: ${totalAscensores > 0 ? ((cMixto/totalAscensores)*100).toFixed(1) : 0}% (${cMixto})</div>
                        </div>
                        <div style="width: 220px; height: 220px;">
                            <canvas id="graficoEstadoAscensoresVivo"></canvas>
                        </div>
                    </div>`;

                visor.innerHTML = html;[cite: 10]

                setTimeout(() => {[cite: 10]
                    const ctx = document.getElementById('graficoEstadoAscensoresVivo')?.getContext('2d');[cite: 10]
                    if (ctx) {[cite: 10]
                        if (typeof chartAscVivo !== 'undefined' && chartAscVivo) chartAscVivo.destroy();[cite: 10]
                        window.chartAscVivo = new Chart(ctx, {[cite: 10]
                            type: 'pie',[cite: 10]
                            data: { [cite: 10]
                                labels: ['Funcionando', 'Mantenimiento', 'Fuera de Servicio', 'Ascensoristas'], [cite: 10]
                                datasets: [{ [cite: 10]
                                    data: [cVerde, cAmarillo, cRojo, cMixto], [cite: 10]
                                    backgroundColor: ['#28a745', '#ffc107', '#dc3545', '#007bff'] [cite: 10]
                                }] [cite: 10]
                            },
                            options: { [cite: 10]
                                responsive: true, [cite: 10]
                                plugins: { legend: { position: 'bottom' } } [cite: 10]
                            }
                        });
                    }
                }, 50);

            } catch (err) {
                console.error("Error al obtener estado actual de ascensores:", err);[cite: 10]
                visor.innerHTML = '<p style="text-align:center; color: red;">Error al cargar los datos de ascensores y escaleras.</p>';[cite: 10]
            }
        }

        function actualizarPrint(id) {[cite: 10]
            const depto = document.getElementById('depto-destino-' + id).value;[cite: 10]
            const turno = document.getElementById('turno-destino-' + id).value;[cite: 10]
            document.getElementById('print-header-' + id).innerText = `Dirigido a: ${depto} | Turno: ${turno}`;[cite: 10]
        }

        function previsualizar(input, id) {[cite: 10]
            const file = input.files[0];[cite: 10]
            const reader = new FileReader();[cite: 10]
            reader.onload = function(e) {[cite: 10]
                archivoData[id] = { name: file.name, type: file.type, data: e.target.result };[cite: 10]
                const prev = document.getElementById('preview-' + id);[cite: 10]
                prev.style.display = 'block';[cite: 10]
                prev.innerHTML = file.type.startsWith('image') ? `<img src="${e.target.result}" style="max-width:200px; display:block; margin-top:10px;">` : `Archivo adjunto: ${file.name}`;[cite: 10]
            };
            reader.readAsDataURL(file);[cite: 10]
        }

        async function guardarRedaccion(id) {[cite: 10]
            const destino = document.getElementById('depto-destino-' + id).value;[cite: 10]
            const turno = document.getElementById('turno-destino-' + id).value;[cite: 10]
            const textoEscrito = document.getElementById('txt-' + id).value;[cite: 10]

            let listaArchivos = [];[cite: 10]
            let primerArchivo = null;[cite: 10]

            if (id === 'novedades') {[cite: 10]
                listaArchivos = archivosMultiplesNovedades;[cite: 10]
                primerArchivo = archivosMultiplesNovedades.length > 0 ? archivosMultiplesNovedades[0] : null;[cite: 10]
            } else {
                primerArchivo = archivoData[id] || null;[cite: 10]
                listaArchivos = primerArchivo ? [primerArchivo] : [];[cite: 10]
            }

            const data = {[cite: 10]
                texto: textoEscrito,[cite: 10]
                archivos: listaArchivos,[cite: 10]
                archivo: primerArchivo,[cite: 10]
                fecha: new Date().toLocaleString(),[cite: 10]
                departamento: destino,[cite: 10]
                turno: turno[cite: 10]
            };
            
            let nombreDeptoClave = destino;[cite: 10]
            if (destino === 'division-ascensores') nombreDeptoClave = 'Ascensores';[cite: 10]
            if (destino === 'camilleros-central') nombreDeptoClave = 'Camilleros';[cite: 10]
            if (destino === 'intendencia') nombreDeptoClave = 'Intendencia';[cite: 10]
            if (destino === 'lavadero-central') nombreDeptoClave = 'Lavadero';[cite: 10]
            if (destino === 'higiene-y-seguridad') nombreDeptoClave = 'Higiene y Seguridad';[cite: 10]
            if (destino === 'dalo') nombreDeptoClave = 'DALO';[cite: 10]
            if (destino === 'direccion-servicios-generales') nombreDeptoClave = 'DSG';[cite: 10]
            if (destino === 'Todos') nombreDeptoClave = 'Todos';[cite: 10]

            const claveUnica = `comunicado_novedades_${nombreDeptoClave}_${turno}_${Date.now()}`;[cite: 10]
            
            const { error } = await db[cite: 10]
                .from('comunicados_memos')[cite: 10]
                .upsert([cite: 10]
                    { id_clave: claveUnica, contenido: data },[cite: 10]
                    { onConflict: 'id_clave' }[cite: 10]
                );

            if (error) {
                console.error("Error al guardar en Supabase:", error);[cite: 10]
                alert("Error al enviar a la base de datos: " + error.message);[cite: 10]
            } else {
                alert("Novedad enviada correctamente al destino seleccionado.");[cite: 10]
                if (id === 'novedades') {[cite: 10]
                    cargarHistorialMuroNovedades();[cite: 10]
                    archivosMultiplesNovedades = [];[cite: 10]
                }
            }
        }

        async function generarReporteMensual() {[cite: 10]
            const tipo = document.getElementById('est-tipo').value;[cite: 10]
            const deptoSeleccionado = document.getElementById('est-depto').value;[cite: 10]
            const turnoSeleccionado = document.getElementById('est-turno').value;[cite: 10]
            const mes = document.getElementById('est-mes').value;[cite: 10]
            const anio = document.getElementById('est-anio').value;[cite: 10]
            const visor = document.getElementById('visor-estadisticas');[cite: 10]
            
            visor.innerHTML = "<p>Cargando datos desde la nube...</p>";[cite: 10]

            if (tipo === 'rrhh') {[cite: 10]
                let p = 0, a = 0, l = 0;[cite: 10]
                const { data: asistData } = await db.from('rrhh_asistencia').select('*');[cite: 10]
                if (asistData) {[cite: 10]
                    asistData.forEach(ag => {[cite: 10]
                        const f = new Date(ag.fecha);[cite: 10]
                        const matchFecha = (f.getMonth() + 1) == mes && f.getFullYear() == anio;[cite: 10]
                        const matchTurno = (turnoSeleccionado === 'Todos' || ag.turno === turnoSeleccionado);[cite: 10]
                        const matchDepto = (deptoSeleccionado === 'Todos' || ag.departamento === deptoSeleccionado);[cite: 10]

                        if (matchFecha && matchTurno && matchDepto) {[cite: 10]
                            const est = String(ag.estado_asistencia || '').trim().toLowerCase();[cite: 10]
                            if (est === 'presente' || est === 'p') p++;[cite: 10]
                            else if (est === 'ausente' || est === 'a') a++;[cite: 10]
                            else if (est === 'licencia' || est === 'l') l++;[cite: 10]
                        }
                    });
                }
                
                if (p+a+l === 0) { visor.innerHTML = "No hay datos para esta selección."; return; }[cite: 10]
                visor.innerHTML = `<h3>Asistencia (${deptoSeleccionado}) ${mes}/${anio}</h3><div style="width:300px; height:300px; margin:auto;"><canvas id="graficoMes"></canvas></div><p><b>Presentismo:</b> ${((p/(p+a+l))*100).toFixed(1)}%</p>`;[cite: 10]
                new Chart(document.getElementById('graficoMes'), { type: 'doughnut', data: { labels: ['Presentes', 'Ausentes', 'Licencias'], datasets: [{ data: [p, a, l], backgroundColor: ['#28a745', '#dc3545', '#ffc107'] }] } });[cite: 10]
            
            } else if (tipo === 'ascensores') {[cite: 10]
                const { data: ascData } = await db.from('registros_ascensores').select('*');[cite: 10]
                let func = 0, falla = 0;[cite: 10]
                if (ascData) {[cite: 10]
                    ascData.forEach(item => {[cite: 10]
                        const f = new Date(item.fecha_cierre);[cite: 10]
                        const matchFecha = (f.getMonth() + 1) == mes && f.getFullYear() == anio;[cite: 10]
                        const matchTurno = (turnoSeleccionado === 'Todos' || item.turno === turnoSeleccionado);[cite: 10]
                        const matchDepto = (deptoSeleccionado === 'Todos' || item.departamento === deptoSeleccionado);[cite: 10]

                        if (matchFecha && matchTurno && matchDepto) {[cite: 10]
                            const txt = String(item.estado || '').trim().toLowerCase();[cite: 10]
                            if (txt.includes('funciona') || txt.includes('ok') || txt === 'p') func++;[cite: 10]
                            else if (txt.includes('falla') || txt.includes('fuera') || txt === 'a' || txt === 'l') falla++;[cite: 10]
                        }
                    });
                }

                            <div style="font-size: 16px; font-weight: bold; color: #1a3a5f; margin-bottom: 10px;">Planilla Operativa (${reg.departamento})</div>
                            <div style="background-color: #1a3a5f; color: white; padding: 8px 12px; font-weight: bold; font-size: 14px; margin-top: 15px; border: 1px solid #333;">Observaciones y Contenido:</div>
                            <div style="padding: 0px 15px; min-height: 100px; background: #fff; border: 1px solid #333; border-top: none; font-family: 'Courier New', Courier, monospace; font-size: 16px; line-height: 30px; background-image: linear-gradient(#e0e0e0 1px, transparent 1px); background-size: 100% 30px;">
                                <p style="margin: 0; padding: 0; white-space: pre-wrap;">${reg.observaciones || 'Sin datos adicionales.'}</p>
                            </div>
                        </div>
                    `;[cite: 10]
                    visor.innerHTML = tablaDinamica;[cite: 10]
                }

            } else if (tipo === 'reportes' || tipo === 'insumos') {[cite: 10]
                if (error || !reg) {[cite: 10]
                    visor.innerHTML = `<p style='color: red; font-weight: bold;'>No se encontraron registros para ${deptoFiltro} en el turno ${turno} (${fechaBusqueda}).</p>`;[cite: 10]
                    return;
                }
                visor.innerHTML = `<h3>Reporte Diario - Vista de Auditoría</h3><style>.hoja-modelo-limpio { width: 100% !important; background-color: #fff !important; border: 1px solid #ccc !important; padding: 30px !important; position: relative !important; min-height: 800px !important; font-family: 'Courier New', Courier, monospace !important; font-size: 16px !important; line-height: 30px !important; box-sizing: border-box !important; background-image: linear-gradient(to right, transparent 0px, transparent 0px), linear-gradient(#e0e0e0 1px, transparent 1px) !important; background-size: 100% 30px !important; white-space: pre-wrap !important; }</style><div class="hoja-modelo-limpio">${reg.reporte_diario || 'No hay contenido de reporte.'}</div>`;[cite: 10]
            }
        }
        document.getElementById('reportes').classList.add('activo');[cite: 10]
        cargarHistorialMuroNovedades();[cite: 10]
    </script>
</body>
</html>
